# Public repository CI. Three jobs: package checks, leak scan, one headless year.
# Game data comes from the official CDN. The content catalogue is not used.
name: OpexAI public CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

# No bytecode cache: the leak scan must only see the checked-out tree.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  package:
    name: Package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate the AI archive
        run: python tools/ci_validate.py

  leak-scan:
    name: Leak scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Planted leak must fail the scan
        run: python tools/ci_validate.py --prove-leak-scan

      - name: Scan this tree
        run: python tools/leak_scan.py .

  smoke:
    name: Smoke 1x1
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the headless runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates xz-utils unzip libfluidsynth3

      - name: Run one short game
        run: python tools/ci_smoke.py --years 1 --map-log2 8 --seed 42
