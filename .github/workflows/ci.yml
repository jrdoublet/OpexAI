name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in \
            ai/OpexAI/info.nut \
            ai/OpexAI/main.nut \
            LICENSE \
            ai/OpexAI/readme.txt \
            ai/OpexAI/changelog.txt
          do
            if [ ! -f "$f" ]; then
              echo "ERROR: missing required file: $f" >&2
              exit 1
            fi
          done
          echo "OK: all required files present"

      - name: Check ASCII encoding and SPDX headers
        run: python3 .github/scripts/check_nut.py --ascii-spdx ai/OpexAI

      - name: Check Squirrel bracket balance
        run: python3 .github/scripts/check_nut.py --brackets ai/OpexAI

      - name: Build reproducible tar archive and MD5
        id: package
        run: |
          VERSION="$(python3 -c '
          import re, sys
          from pathlib import Path
          text = Path("ai/OpexAI/info.nut").read_text(encoding="ascii")
          m = re.search(r"function\s+GetVersion\s*\(\s*\)\s*\{\s*return\s+([0-9]+)\s*;\s*\}", text)
          if not m:
              sys.exit("ERROR: GetVersion() not found in ai/OpexAI/info.nut")
          print(m.group(1))
          ')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          ARCHIVE="OpexAI-${VERSION}.tar"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -cf "dist/${ARCHIVE}" -C ai OpexAI
          (cd dist && md5sum "${ARCHIVE}" > "${ARCHIVE}.md5" && cat "${ARCHIVE}.md5")

      - name: Upload OpexAI archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpexAI-${{ steps.package.outputs.version }}
          path: |
            dist/OpexAI-${{ steps.package.outputs.version }}.tar
            dist/OpexAI-${{ steps.package.outputs.version }}.tar.md5
          if-no-files-found: error
